<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Las 11:11 - Pide un Deseo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/luxon/2.0.2/luxon.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="clock" id="clock"></div>
        <div class="message" id="message">
            <h1>¡11:11 Es hora de pedir un deseo!</h1>
            <p>Pide un deseo mi Vivi a esta hora todo se puede solo ten fe y se cumplira, te quiero mucho!! </p>
            <button id="pideDeseoBtn">Pide un Deseo</button>
        </div>
        <div id="deseoForm" class="deseo-form" style="display: none;">
            <textarea id="deseoInput" placeholder="Escribe tu deseo aquí..."></textarea>
            <button id="enviarDeseoBtn">Enviar Deseo</button>
            <div id="respuesta"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
